---
# The list of models (ai_models) is a site setting: inventory/group_vars/all/main.yml.

# Hugging Face endpoints: the API lists the files of a repository with their
# SHA-256, the resolve URL serves the file.
models_hf_api: "https://huggingface.co/api/models"
models_hf_resolve: "https://huggingface.co"

# Seconds a download may stay below 1 KB/s before curl drops the connection
# and retries, resuming where it stopped.
models_download_timeout: 120

# Retries of a dropped or stalled download within one run.
models_download_retries: 20
