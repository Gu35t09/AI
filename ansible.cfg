[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
force_handlers = True

[privilege_escalation]
# The playbook runs as your own user: llama.cpp, llama-swap, the models and the
# launcher all live in your home directory. Only the tasks that install
# packages or change group membership ask for root, with "become: true" on the
# task itself. Run the playbook with -K so sudo can ask for your password.
become = False
become_method = sudo
